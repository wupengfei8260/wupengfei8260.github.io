<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的App - 手机画布尺寸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 页面背景灰色，让手机画布居中 */
        body {
            background: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
                /* 手机画布容器 - iPhone 16 Pro Max 尺寸 (440px 逻辑宽度) */
        .phone-canvas {
            width: 390px;           /* 宽度 */
            height: 844px;          /* 高度 - 19.5:9 修长比例 */
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
          
        }
        
        /* 内容区域 - 可滚动 */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        
        /* 底部导航 */
        .app-nav {
            background: white;
            display: flex;
            justify-content: space-between;
            padding: 8px 14px 10px;
            border-top: 1px solid #e8e8e8;
            flex-shrink: 0;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 12px;
            transition: all 0.2s;
            min-width: 56px;
        }
        
        .nav-item .icon {
            font-size: 22px;
            color: #7a7a7a;
            line-height: 1;
        }
        
        .nav-item .label {
            font-size: 10px;
            color: #9a9a9a;
        }
        
        .nav-item.active {
            background: transparent;
        }
        
        .nav-item.active .label {
            color: #1f6fff;
            font-weight: 500;
        }

        .nav-item.active .icon {
            color: #1f6fff;
        }

        .nav-item.center-nav .icon {
            width: 56px;
            height: 56px;
            border-radius: 999px;
            background: linear-gradient(180deg, #61adff, #2f6fff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -16px;
            border: 4px solid #f5f5f5;
        }

        .scan-icon {
            position: relative;
            width: 24px;
            height: 24px;
        }

        .scan-icon::before,
        .scan-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 6px;
            clip-path: polygon(0 0, 35% 0, 35% 12%, 12% 12%, 12% 35%, 0 35%, 0 0, 100% 0, 100% 35%, 88% 35%, 88% 12%, 65% 12%, 65% 0, 100% 0, 100% 100%, 65% 100%, 65% 88%, 88% 88%, 88% 65%, 100% 65%, 100% 100%, 0 100%, 0 65%, 12% 65%, 12% 88%, 35% 88%, 35% 100%, 0 100%);
        }

        .scan-icon::after {
            inset: 10px 4px;
            border: none;
            border-top: 2px solid rgba(255, 255, 255, 0.95);
            clip-path: none;
        }

        .nav-item.center-nav .label {
            opacity: 0;
        }
        
        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn:active { transform: scale(0.98); }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #f8f9fa;
        }
        
        /* 滚动条美化 */
        .app-content::-webkit-scrollbar {
            width: 4px;
        }
        
        .app-content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .app-content::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="phone-canvas">
        <div class="app-content" id="appContent">
            <div class="loading">加载中...</div>
        </div>
        
        <div class="app-nav">
            <button class="nav-item active" data-module="home">
                <span class="icon">🏠</span>
                <span class="label">首页</span>
            </button>
            <button class="nav-item" data-module="consult">
                <span class="icon">#</span>
                <span class="label">资讯</span>
            </button>
            <button class="nav-item center-nav" data-module="home">
                <span class="icon"><span class="scan-icon"></span></span>
                <span class="label">扫描</span>
            </button>
            <button class="nav-item" data-module="data">
                <span class="icon">👤</span>
                <span class="label">客户</span>
            </button>
            <button class="nav-item" data-module="profile">
                <span class="icon">◔</span>
                <span class="label">我的</span>
            </button>
        </div>
    </div>

    <script type="module">
        // 模块配置
        const modules = {
            home: { name: '首页', file: 'modules/home/index.js' },
            consult: { name: '咨询', file: 'modules/consult.js' },
            data: { name: '数据', file: 'modules/data.js' },
            profile: { name: '我的', file: 'modules/profile.js' },
            reviewDaily: { name: '复盘日报', file: 'modules/home/reviewDaily.js' }
        };
        
        let currentModule = null;
        
        async function loadModule(moduleId) {
            const module = modules[moduleId];
            if (!module) return;
            
            currentModule = moduleId;
            
            // 更新导航样式
            document.querySelectorAll('.nav-item').forEach(btn => {
                if (btn.dataset.module === moduleId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            const contentDiv = document.getElementById('appContent');
            contentDiv.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const url = new URL(`./${module.file}?t=${Date.now()}`, import.meta.url);
                const moduleExports = await import(url.href);
                if (moduleExports.render) {
                    await moduleExports.render('appContent', {
                        navigateTo: loadModule,
                        showToast: (msg) => alert(msg)
                    });
                }
            } catch (error) {
                console.error('加载失败:', error);
                contentDiv.innerHTML = `
                    <div class="card">
                        <h3>❌ 加载失败</h3>
                        <p>请确保 modules/${module.file} 文件存在</p>
                        <p style="font-size:12px;color:#999;margin-top:10px;">错误: ${error.message}</p>
                        <p style="font-size:12px;color:#999;margin-top:5px;">提示: 建议用 VS Code Live Server 打开</p>
                    </div>
                `;
            }
        }

        async function openScanner() {
            try {
                const url = new URL(`./modules/scan.js?t=${Date.now()}`, import.meta.url);
                const scanModule = await import(url.href);
                if (scanModule.openScanModal) {
                    await scanModule.openScanModal({
                        mountSelector: '.phone-canvas',
                        showToast: (msg) => alert(msg)
                    });
                }
            } catch (error) {
                console.error('扫描模块加载失败:', error);
                alert(`扫描模块加载失败: ${error.message}`);
            }
        }
        
        // 绑定导航点击
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('center-nav')) {
                    openScanner();
                    return;
                }

                const moduleId = btn.dataset.module;
                if (moduleId !== currentModule) {
                    loadModule(moduleId);
                }
            });
        });
        
        // 启动应用
        loadModule('home');
    </script>
</body>
</html>
